<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08080c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="力扣刷题" />
  <meta name="format-detection" content="telephone=no, email=no, address=no" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
  <title>力扣刷题小助手</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="topbar">
      <a class="brand" href="#/list">
        <span class="logo">⚡</span>
        <span class="brand-text">
          <span class="brand-name">力扣刷题</span>
          <span class="brand-slogan">题海翻遍千行泪，AC难求一寸光</span>
        </span>
      </a>
      <button class="add-btn" id="backupBtn" type="button" aria-label="数据备份" title="数据备份">↓</button>
    </div>
    <nav class="nav">
      <a href="#/list" data-nav="list">题目</a>
      <a href="#/stats" data-nav="stats">统计<span class="nav-badge" id="reviewBadge" hidden></span></a>
    </nav>
  </header>

  <main id="app">加载中…</main>

  <div class="action-sheet-backdrop" id="backupSheet" hidden>
    <div class="action-sheet">
      <div class="action-sheet-handle"></div>
      <div class="action-sheet-title">数据导出 / 备份</div>
      <button class="action-sheet-item" data-act="export">
        <span class="ic">⬇︎</span><span class="t">备份全部数据（JSON）<span class="d">完整备份，换手机时可导入恢复</span></span>
      </button>
      <label class="action-sheet-item" data-act="import">
        <span class="ic">⬆︎</span><span class="t">从备份导入恢复<span class="d">选择之前导出的 JSON 备份文件</span></span>
        <input type="file" id="fileImport" accept="application/json" hidden />
      </label>
      <button class="action-sheet-item danger" data-act="clear">
        <span class="ic">🗑</span><span class="t">清空全部数据<span class="d">仅删除本机数据，操作前请先备份</span></span>
      </button>
      <button class="action-sheet-item gh-item" data-act="github">
        <span class="ic">⌥</span><span class="t">GitHub 云同步<span class="d">把题解改动备份到你的 GitHub 仓库，换手机也能恢复</span></span>
      </button>
      <button class="action-sheet-item cancel" data-act="cancel">取消</button>
    </div>
  </div>

  <div class="action-sheet-backdrop gh-sheet" id="ghSheet" hidden>
    <div class="action-sheet gh-panel">
      <button class="gh-close" data-act="ghcancel" aria-label="关闭">×</button>
      <div class="gh-title">GitHub 云同步</div>
      <div class="gh-form">
        <label class="gh-field"><span>Personal Access Token</span><input type="password" id="ghToken" placeholder="ghp_xxx" autocomplete="off" /></label>
        <p class="gh-hint">在 GitHub → Settings → Developer settings → Personal access tokens 创建，勾选 <code>repo</code> 权限。Token 仅保存在本机。</p>
        <label class="gh-field"><span>仓库</span><input id="ghRepoFull" placeholder="用户名/仓库名（如 Iexplain/leetcode-track）" autocomplete="off" /></label>
        <p class="gh-hint">格式：用户名/仓库名</p>
        <label class="gh-field"><span>分支</span><input id="ghBranch" placeholder="main" autocomplete="off" /></label>
        <label class="gh-field"><span>备份文件路径</span><input id="ghFilePath" placeholder="data/problems/{id}.json（留空默认）" autocomplete="off" /></label>
        <p class="gh-hint">题解改动会上传到上面路径的 JSON（每题一个文件）。留空则写到 data/problems/{id}.json。</p>
      </div>
      <div class="gh-actions">
        <button class="btn btn-primary" data-act="ghupload">↑ 上传到 GitHub</button>
        <button class="btn btn-ghost" data-act="ghpull">↓ 从 GitHub 拉取</button>
      </div>
    </div>
  </div>

  <script src="js/vendor/chart.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/github.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
