<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08080c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="力扣刷题" />
  <meta name="format-detection" content="telephone=no, email=no, address=no" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
  <title>力扣刷题小助手</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="topbar">
      <a class="brand" href="#/list">
        <span class="logo">⚡</span>
        <span class="brand-text">
          <span class="brand-name">力扣刷题</span>
          <span class="brand-slogan">题海翻遍千行泪，AC难求一寸光</span>
        </span>
      </a>
      <button class="icon-btn" id="ghBtn" type="button" aria-label="GitHub 上传设置" title="GitHub 上传设置">⚙</button>
      <button class="add-btn" id="backupBtn" type="button" aria-label="数据备份" title="数据备份">＋</button>
    </div>
    <nav class="nav">
      <a href="#/list" data-nav="list">题目</a>
      <a href="#/stats" data-nav="stats">统计<span class="nav-badge" id="reviewBadge" hidden></span></a>
    </nav>
  </header>

  <main id="app">加载中…</main>

  <div class="action-sheet-backdrop" id="backupSheet" hidden>
    <div class="action-sheet">
      <div class="action-sheet-handle"></div>
      <div class="action-sheet-title">数据备份</div>
      <button class="action-sheet-item" data-act="export">⬇︎ 导出全部记录 (JSON)</button>
      <label class="action-sheet-item" data-act="import">⬆︎ 导入 JSON 备份<input type="file" id="fileImport" accept="application/json" hidden /></label>
      <button class="action-sheet-item danger" data-act="clear">🗑 清空全部记录</button>
      <button class="action-sheet-item cancel" data-act="cancel">取消</button>
    </div>
  </div>

  <div class="action-sheet-backdrop" id="ghSheet" hidden>
    <div class="action-sheet">
      <div class="action-sheet-handle"></div>
      <div class="action-sheet-title">GitHub 上传设置</div>
      <div class="gh-form">
        <label class="gh-field"><span>个人访问令牌 (PAT)</span><input type="password" id="ghToken" placeholder="ghp_... 或 github_pat_..." autocomplete="off" /></label>
        <label class="gh-field"><span>仓库 owner</span><input id="ghOwner" placeholder="Iexplain" autocomplete="off" /></label>
        <label class="gh-field"><span>仓库名 repo</span><input id="ghRepo" placeholder="leetcode-track" autocomplete="off" /></label>
        <label class="gh-field"><span>分支 branch</span><input id="ghBranch" placeholder="main" autocomplete="off" /></label>
      </div>
      <p class="gh-tip">令牌仅保存在本机浏览器。建议用 fine-grained token 并只授权本仓库的 Contents 读写权限。</p>
      <button class="action-sheet-item" data-act="ghsave">保存设置</button>
      <button class="action-sheet-item cancel" data-act="ghcancel">取消</button>
    </div>
  </div>

  <script src="js/vendor/chart.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/github.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
